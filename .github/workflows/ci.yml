name: CI - Automated Testing & Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-test:
    name: Backend Tests (JUnit 5 & Mockito)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x lovethyneighbor-backend/mvnw

      - name: Run Spring Boot test suite
        run: |
          cd lovethyneighbor-backend
          ./mvnw test

  frontend-test:
    name: Frontend Tests & Build (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm run test:run

      - name: Verify Vite production build
        run: npm run build
