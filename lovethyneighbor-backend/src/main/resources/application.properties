spring.application.name=lovethyneighbor
spring.main.allow-bean-definition-overriding=true

# Heroku Dynamic Port Binding, Proxy Headers & Basic Dyno Tuning
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.compression.enabled=true
server.compression.min-response-size=1024
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=5
spring.jpa.open-in-view=false
app.cookie.secure=${COOKIE_SECURE:false}

# PostgreSQL Database Configuration
# Automatically binds to Heroku Postgres (JDBC_DATABASE_URL) or falls back to DB_* variables / localhost
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lovethyneighbor}?sslmode=${DB_SSLMODE:prefer}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${JDBC_DATABASE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# HikariCP Connection Pooling (Optimized for Heroku Essential-0 20-connection limit)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Encryption and JWT Secrets (OS env vars and .env override these dev/test fallbacks)
app.security.encryption-key=${ENCRYPTION_KEY:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.security.jwt-secret=${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}

# Production safeguard: disable dev seed endpoint unless explicitly enabled
app.dev.seed-enabled=${ENABLE_SEED_TEST_DATA:false}

# DT-51: hours a recipient must wait between food requests
app.claims.cooldown-hours=24

# DT-87: how often to check for unclaimed listings whose pickup window has ended
app.listings.expiry-check-minutes=5

# DT-332: base URL of the React app, used in signup verification links
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Optional initial admin bootstrap (only creates if missing and both env vars are set)
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}

# Optional Firebase Admin credentials JSON or file path for server-side FCM push delivery
app.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
