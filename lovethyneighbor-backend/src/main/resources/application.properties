spring.application.name=lovethyneighbor
spring.main.allow-bean-definition-overriding=true

# Heroku Dynamic Port Binding (defaults to 8080 locally)
server.port=${PORT:8080}

# PostgreSQL Database Configuration
# Automatically binds to Heroku Postgres (JDBC_DATABASE_URL) or falls back to DB_* variables / localhost
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lovethyneighbor}?sslmode=${DB_SSLMODE:prefer}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${JDBC_DATABASE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# HikariCP Connection Pooling (Optimized for Heroku Essential-0 20-connection limit)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Encryption and JWT Secrets (defaults provided for testing / dev fallback)
ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
JWT_SECRET=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=

# DT-51: hours a recipient must wait between food requests
app.claims.cooldown-hours=24

# DT-87: how often to check for unclaimed listings whose pickup window has ended
app.listings.expiry-check-minutes=5

# DT-332: base URL of the React app, used in signup verification links
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
